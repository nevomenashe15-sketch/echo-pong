apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: echo-pong
  labels:
    app.kubernetes.io/name: echo-pong
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: echo-pong
  policyTypes:
    - Ingress
    - Egress
  # Only the ingress controller may reach the app — this is the "no direct
  # internet access, use ingress/proxy" requirement. Assumes an ingress
  # controller (e.g. ingress-nginx) running in a namespace labeled
  # kubernetes.io/metadata.name=ingress-nginx (the label Kubernetes has
  # auto-applied to every namespace since 1.21).
  #
  # IMPORTANT, verify before relying on this in a real cluster: this rule
  # does not list an explicit allowance for kubelet-originated probe
  # traffic (startup/readiness/liveness all connect to the pod the same way
  # any other client would, which is ingress from the pod's point of view).
  # Whether that traffic is exempt from NetworkPolicy enforcement is a
  # property of the specific CNI/policy engine in use, not something
  # guaranteed by the NetworkPolicy spec itself or by this manifest — it
  # must be verified against whatever cluster this actually deploys to
  # (test a policy-enforcing pod on a staging cluster before assuming it
  # works), not assumed from this comment. If probes start failing only
  # once NetworkPolicy is enforced, this is the first place to look.
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  # No egress rules at all: this app makes zero outbound calls (verified
  # from main.go — it only reads a local file and serves HTTP), so egress
  # is denied entirely rather than narrowed to "what's needed" because
  # nothing is needed. Note: kubelet-initiated probe traffic (startup/
  # readiness/liveness) reaches the pod from the node directly and is not
  # egress traffic from the pod's point of view, so it isn't affected by
  # this policy — but whether NetworkPolicy is enforced at all, and how CNIs
  # treat kubelet traffic, is CNI-dependent (see docs/ARCHITECTURE.md).
  egress: []
