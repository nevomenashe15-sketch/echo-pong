# TEMPLATE ONLY — do not `kubectl apply` this file as-is, and never commit a
# real secret value in its place. It exists to document the shape of the
# Secret the Deployment expects (see k8s/base/deployment.yaml's volumeMounts).
# This file is intentionally NOT listed in any kustomization.yaml, so it is
# never applied as part of `kubectl apply -k`.
#
# To create the real Secret in an actual cluster:
#   kubectl create secret generic echo-pong-secret \
#     --namespace echo-pong \
#     --from-file=token=/path/to/your/local/secret-file \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# For local Kind testing, `make deploy-local` generates this Secret via a
# Kustomize secretGenerator from a gitignored local file — see
# k8s/overlays/kind/kustomization.yaml. Nothing under k8s/overlays/kind/
# ever contains a real secret value in git.
#
# For real cloud deployments, prefer not committing even a bootstrap Secret
# manifest at all — see docs/ARCHITECTURE.md's "Cloud deployment on AWS EKS"
# section for the External Secrets Operator / Secrets Manager approach.
apiVersion: v1
kind: Secret
metadata:
  name: echo-pong-secret
  namespace: echo-pong
type: Opaque
stringData:
  token: CHANGE-ME-this-is-a-placeholder-not-a-real-secret
