apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Rewrites the base's ghcr.io/nevomenashe15-sketch/echo-pong image reference
# to a locally-tagged image that is only ever loaded into Kind directly
# (`kind load docker-image ping-pong-game:kind-local`), never pulled from
# any registry. The production image reference in k8s/base/deployment.yaml
# is untouched by this overlay.
images:
  - name: ghcr.io/nevomenashe15-sketch/echo-pong
    newName: ping-pong-game
    newTag: kind-local

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: echo-pong

# Builds the echo-pong-secret Secret from a local, gitignored file
# (.secret.local) instead of any value committed to the repo. `make
# deploy-local` writes that file with a throwaway test token immediately
# before applying this overlay, and it never leaves the local machine.
# disableNameSuffixHash keeps the generated name exactly "echo-pong-secret"
# so it matches the volume reference in k8s/base/deployment.yaml.
secretGenerator:
  - name: echo-pong-secret
    namespace: echo-pong
    type: Opaque
    files:
      - token=.secret.local

generatorOptions:
  disableNameSuffixHash: true
