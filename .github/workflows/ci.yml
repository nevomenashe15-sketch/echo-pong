name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default to read-only; individual jobs opt into anything more.
permissions:
  contents: read

env:
  GO_VERSION: "1.24"
  HADOLINT_VERSION: "v2.15.0" # https://github.com/hadolint/hadolint/releases/tag/v2.15.0
  ACTIONLINT_VERSION: "1.7.9" # https://github.com/rhysd/actionlint/releases/tag/v1.7.9
  KUBECONFORM_VERSION: "v0.7.0" # https://github.com/yannh/kubeconform/releases/tag/v0.7.0
  K8S_SCHEMA_VERSION: "1.31.0"

jobs:
  go-checks:
    uses: ./.github/workflows/go-checks.yml

  docker-lint:
    name: hadolint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install hadolint
        run: |
          curl -sSfL -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/${{ env.HADOLINT_VERSION }}/hadolint-Linux-x86_64"
          chmod +x /usr/local/bin/hadolint
      - run: make docker-lint

  workflow-lint:
    name: actionlint (GitHub Actions workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install actionlint
        run: go install "github.com/rhysd/actionlint/cmd/actionlint@v${{ env.ACTIONLINT_VERSION }}"
      - run: make workflow-lint

  yaml-lint:
    name: yamllint (k8s + workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install yamllint
        run: pip install --user "yamllint==1.35.1"
      - run: make yaml-lint

  k8s-validate:
    name: kubeconform (rendered manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${{ env.KUBECONFORM_VERSION }}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform
      - name: Generate throwaway local test secret (CI only, never a real credential)
        run: echo -n "ci-schema-validation-placeholder-token" > k8s/overlays/kind/.secret.local
      - run: make k8s-validate

  no-committed-secrets:
    name: no committed Secret values
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: make no-committed-secrets

  docker-build-check:
    name: multi-arch build check (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build for linux/amd64 and linux/arm64 (build-only, no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
