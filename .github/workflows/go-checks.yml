name: Go checks (reusable)

# Shared by ci.yml (every push/PR) and release.yml (tag pushes, as a gate
# before anything is built/published) so the two pipelines can never drift
# on what "passing" means.
on:
  workflow_call:

permissions:
  contents: read

env:
  GO_VERSION: "1.24"
  GOLANGCI_LINT_VERSION: "v2.12.2" # https://github.com/golangci/golangci-lint/releases/tag/v2.12.2

jobs:
  go-checks:
    name: go fmt / vet / lint / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Install golangci-lint
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}"
      - run: make fmt
      - run: make lint
      - run: make test
